<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaoOS project placeholder</title>
  <desc id="desc">A black xiaoOS-style project placeholder with a geometric grid, system label, and animated wireframe mark.</desc>
  <defs>
    <style>
      .wire { stroke-dasharray: 1; stroke-dashoffset: 1; }
      .build-guide { opacity: 0; }
    </style>
    <pattern id="triGrid" width="96" height="84" patternUnits="userSpaceOnUse">
      <path d="M0 84L48 0L96 84M0 0L96 84M96 0L0 84M48 0V84" stroke="#F4EFE6" stroke-opacity="0.105" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V10" stroke="#F4EFE6" stroke-opacity="0.5" stroke-width="2"/>
    </pattern>
    <filter id="chalk">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#050505"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="96 84" dur="18s" repeatCount="indefinite"/>
    <rect x="-96" y="-84" width="1392" height="843" fill="url(#triGrid)"/>
  </g>
  <path d="M-90 432C170 334 282 368 486 308C717 241 872 176 1292 196" stroke="#F4EFE6" stroke-opacity="0.08" stroke-width="5"/>
  <path d="M-60 518C160 430 332 458 572 362C802 270 982 254 1280 298" stroke="#F4EFE6" stroke-opacity="0.05" stroke-width="3"/>

  <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="34" y="31" width="112" height="34" fill="#F4EFE6"/>
    <text x="126" y="55" text-anchor="end" fill="#050505" font-size="25" font-weight="700">xiao</text>
    <text x="154" y="55" fill="#F4EFE6" font-size="27" font-weight="600">OS</text>
  </g>

  <g transform="translate(188 134)">
    <rect x="0" y="0" width="824" height="78" fill="#F4EFE6"/>
    <text x="42" y="53" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#050505" font-size="44" font-weight="600">PROJECT PREVIEW</text>
  </g>

